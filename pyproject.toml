[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyquist-compacton-repro"
version = "0.1.0"
description = "Reproducibility package for edge-Floquet Nyquist shedding from numerical compactons"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "sympy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: expensive numerical reproduction"]
